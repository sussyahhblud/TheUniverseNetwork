<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser - The Universe Network</title>
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        .browser-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .page-header {
            text-align: center;
            padding: 2rem 2rem 1rem 2rem;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: 5px;
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .browser-controls {
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-tertiary));
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 1rem 1.5rem;
            margin: 0 2rem 1.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .url-input {
            flex: 1;
            padding: 0.875rem 1.25rem;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .url-input:hover {
            border-color: var(--text-primary);
        }

        .url-input:focus {
            outline: none;
            border-color: var(--text-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .go-button {
            padding: 0.875rem 2rem;
            background: linear-gradient(135deg, #4CAF50, #66BB6A);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(76, 175, 80, 0.5);
            white-space: nowrap;
        }

        .go-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(76, 175, 80, 0.7);
        }

        .go-button:active {
            transform: translateY(-1px);
        }

        .browser-frame-container {
            flex: 1;
            margin: 0 2rem 2rem 2rem;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .browser-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 2rem;
                letter-spacing: 3px;
            }

            .browser-controls {
                flex-direction: column;
            }

            .go-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-logo">UN</a>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/games/">Games</a></li>
                <li><a href="/emulator/">Emulator</a></li>
                <li><a href="/browser/" class="active">Browser</a></li>
                <li><a href="/settings/">Settings</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="browser-container">
        <div class="page-header">
            <h1 class="page-title">Browser</h1>
            <p class="page-subtitle">Browse the web freely with Scramjet proxy</p>
        </div>

        <div class="browser-controls">
            <input 
                type="text" 
                class="url-input" 
                id="urlInput" 
                placeholder="Enter URL (e.g., youtube.com, discord.com, reddit.com)"
                autocomplete="off"
            />
            <button class="go-button" id="goButton">Go</button>
        </div>

        <div class="browser-frame-container">
            <div class="loading-message" id="loadingMessage">
                Enter a URL above to start browsing
            </div>
            <iframe 
                class="browser-frame" 
                id="proxyFrame" 
                style="display: none;"
            ></iframe>
        </div>
    </div>
    
    <script>
        const savedTheme = localStorage.getItem('un-theme') || 'classic';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const urlInput = document.getElementById('urlInput');
        const goButton = document.getElementById('goButton');
        const proxyFrame = document.getElementById('proxyFrame');
        const loadingMessage = document.getElementById('loadingMessage');

        const SCRAMJET_INSTANCE = 'https://scramjet.mercurywork.shop';

        function formatUrl(input) {
            input = input.trim();
            
            if (!input) return '';
            
            if (input.startsWith('http://') || input.startsWith('https://')) {
                return input;
            }
            
            if (input.includes(' ')) {
                return 'https://www.google.com/search?q=' + encodeURIComponent(input);
            }
            
            if (!input.includes('.') && !input.includes(':')) {
                return 'https://www.google.com/search?q=' + encodeURIComponent(input);
            }
            
            return 'https://' + input;
        }

        function navigate() {
            const url = urlInput.value;
            if (!url) {
                alert('Please enter a URL');
                return;
            }

            const formattedUrl = formatUrl(url);
            const proxyUrl = SCRAMJET_INSTANCE + '/service/' + encodeURIComponent(formattedUrl);
            
            console.log('Navigating to:', formattedUrl);
            console.log('Proxy URL:', proxyUrl);
            
            loadingMessage.style.display = 'none';
            proxyFrame.style.display = 'block';
            proxyFrame.src = proxyUrl;
        }

        goButton.addEventListener('click', navigate);
        
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                navigate();
            }
        });

        proxyFrame.addEventListener('load', () => {
            console.log('Proxy frame loaded');
        });

        proxyFrame.addEventListener('error', (e) => {
            console.error('Proxy frame error:', e);
            loadingMessage.textContent = 'Error loading page. Please try again.';
            loadingMessage.style.display = 'block';
        });
    </script>
</body>
</html>
